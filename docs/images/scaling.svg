<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
<title id="title">Two ways to scale with KubeDesk</title>
<desc id="desc">Illustration: set a deployment's desired replicas from three to five, or edit a KEDA ScaledObject's minimum and maximum replica limits from one to twelve. Both actions require Apply to cluster.</desc>
<rect width="1280" height="430" rx="24" fill="#0e1a28"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<text x="44" y="57" fill="#f0f8ff" font-size="28" font-weight="700">A replica count. Or room to scale.</text>
<text x="44" y="86" fill="#8fa8bc" font-size="16">Change deployment replicas or set the bounds for KEDA.</text>
<rect x="44" y="116" width="574" height="250" rx="16" fill="#142638" stroke="#2e475c"/>
<rect x="642" y="116" width="594" height="250" rx="16" fill="#142e32" stroke="#2d5755"/>
<text x="68" y="154" fill="#92bddd" font-size="12" letter-spacing="1.8">DEPLOYMENT</text>
<text x="666" y="154" fill="#62e7ce" font-size="12" letter-spacing="1.8">KEDA SCALEDOBJECT</text>
<text x="68" y="186" fill="#f0f8ff" font-size="21" font-weight="600">api</text>
<text x="666" y="186" fill="#f0f8ff" font-size="21" font-weight="600">queue-worker</text>
<text x="68" y="227" fill="#90a9bf" font-size="14">Desired replicas</text>
<text x="68" y="282" fill="#98afc3" font-size="44">3</text>
<path d="M110 267h46m-9-8 9 8-9 8" fill="none" stroke="#88b9dc" stroke-width="2"/>
<text x="179" y="282" fill="#e7f5ff" font-size="44" font-weight="600">5</text>
<g fill="#6397bf"><rect x="300" y="244" width="40" height="40" rx="8"/><rect x="348" y="244" width="40" height="40" rx="8"/><rect x="396" y="244" width="40" height="40" rx="8"/></g>
<g fill="#9bcdf0"><rect x="444" y="244" width="40" height="40" rx="8"/><rect x="492" y="244" width="40" height="40" rx="8"/></g>
<text x="666" y="227" fill="#92bcb8" font-size="14">Minimum</text><text x="1110" y="227" fill="#92bcb8" font-size="14">Maximum</text>
<text x="666" y="282" fill="#e3fff5" font-size="44" font-weight="600">1</text><text x="1110" y="282" fill="#e3fff5" font-size="44" font-weight="600">12</text>
<path d="M724 267h359" stroke="#26514f" stroke-width="8" stroke-linecap="round"/>
<path d="M724 267h359" stroke="#62e7ce" stroke-width="3" stroke-dasharray="2 10"/>
<text x="68" y="339" fill="#a5bbce" font-size="14">Checks the current replica count before applying.</text>
<text x="666" y="339" fill="#a7c9c4" font-size="14">Validates the range. Preserves triggers and settings.</text>
<text x="44" y="404" fill="#718da3" font-size="13">Review your context and namespace, then choose Apply to cluster.</text>
<text x="968" y="404" fill="#718da3" font-size="12">Feature illustration · example values</text>
</g>
</svg>
